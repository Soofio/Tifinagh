<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="description" content="Apprendre l'alphabet tifinagh du tamazight standard marocain.">
<link rel="manifest" href="manifest.webmanifest">
<title>Tifinagh — Apprendre</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#18202a;--muted:#687386;--accent:#6d4aff;--accent2:#ffb84d;--good:#159447;--bad:#d83a52;--line:#e6e8ef;--shadow:0 12px 35px rgba(20,25,40,.08)}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer}.app{max-width:1100px;margin:auto;padding:18px 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.logo{font-weight:900;font-size:1.25rem}.logo span{color:var(--accent)}
.install{display:none;border:0;background:var(--ink);color:#fff;border-radius:12px;padding:10px 14px}
nav{display:flex;gap:8px;overflow:auto;padding-bottom:4px;margin-bottom:20px}
nav button{white-space:nowrap;border:1px solid var(--line);background:var(--card);padding:10px 14px;border-radius:12px;color:var(--muted)}
nav button.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.hero{background:linear-gradient(135deg,#171d2a,#40326d);color:#fff;border-radius:24px;padding:28px;margin-bottom:20px;box-shadow:var(--shadow)}
.hero h1{font-size:clamp(2rem,7vw,4rem);margin:0 0 6px}.hero p{margin:0;color:#dce0eb}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 5px 18px rgba(20,25,40,.04)}
.letter{font-size:3.2rem;text-align:center;line-height:1.1;margin:5px 0 10px;font-family:"Noto Sans Tifinagh","Segoe UI Symbol",sans-serif}
.center{text-align:center}.muted{color:var(--muted)}.latin{font-size:1.3rem;font-weight:800}.arabic{font-size:1.45rem}
.audio{border:0;background:#eee9ff;color:#5536dc;border-radius:10px;padding:8px 12px;margin-top:10px}
.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:20px 0 12px}.section-title h2{margin:0}
.progress{height:9px;background:#e5e7ed;border-radius:99px;overflow:hidden}.progress>div{height:100%;background:var(--accent);width:0}
.big-card{max-width:620px;margin:20px auto;padding:35px;text-align:center}.big-card .letter{font-size:7rem}
.primary,.secondary{border:0;border-radius:13px;padding:12px 17px;font-weight:750}
.primary{background:var(--accent);color:#fff}.secondary{background:#eef0f5;color:var(--ink)}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-width:600px;margin:18px auto}
.answer{border:2px solid var(--line);background:#fff;border-radius:14px;padding:15px;text-align:left}
.answer.correct{border-color:var(--good);background:#eaf8ef}.answer.wrong{border-color:var(--bad);background:#fff0f2}
.answer .t{font-size:2rem;margin-right:8px}.feedback{text-align:center;font-weight:800;min-height:28px}
.word{font-size:3rem;letter-spacing:.08em;font-family:"Noto Sans Tifinagh","Segoe UI Symbol",sans-serif;margin:20px 0}
input[type=text]{width:100%;max-width:520px;padding:14px 16px;border:2px solid var(--line);border-radius:13px;font-size:1.15rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{text-align:center}.stat b{display:block;font-size:1.7rem}
.hidden{display:none!important}
.small{font-size:.88rem}
.card.hard{border-color:var(--accent2);box-shadow:0 0 0 2px rgba(255,184,77,.35)}
.note{font-size:.78rem;color:var(--muted);margin-top:6px;line-height:1.3}
.audio-note{text-align:center;margin-top:22px}
footer{text-align:center;color:var(--muted);margin-top:35px;font-size:.85rem}
@media(max-width:520px){.answers{grid-template-columns:1fr}.hero{padding:22px}.app{padding:12px 12px 30px}}
</style>
</head>
<body>
<div class="app">
<header><div class="logo">ⵣ <span>Tifinagh</span></div><button id="installBtn" class="install">Installer l'app</button></header>
<nav id="nav"></nav>
<main id="main"></main>
<footer>V1.1 — alphabet complet et vérifié (IRCAM). Contenu linguistique facilement modifiable dans <code>app.js</code>.</footer>
</div>
<script src="app.js"></script>
</body>
</html>
